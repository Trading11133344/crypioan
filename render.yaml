services:
  - type: web
    name: cryptonion          # must match the existing Render service so the URL stays cryptonion.onrender.com
    runtime: node
    region: singapore
    plan: starter            # a persistent disk requires a paid plan; Free has no disk
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /

    # Without this disk the ledger lives on the ephemeral filesystem and every
    # deploy or restart wipes all users, balances and deposits.
    disk:
      name: cryptonion-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"

      # must match the disk mountPath above
      - key: DATA_DIR
        value: /var/data

      # Operator console. Set these in the Render dashboard, never in git.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Optional: replaces ADMIN_PASSWORD with a scrypt hash (npm run admin:2fa)
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Optional: enables the 6-digit authenticator prompt (npm run admin:2fa)
      - key: ADMIN_TOTP_SECRET
        sync: false

      # Signs account-recovery OTPs. Generated once and kept by Render.
      - key: OTP_SECRET
        generateValue: true

      # Optional: Telegram support bridge and OTP delivery
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
